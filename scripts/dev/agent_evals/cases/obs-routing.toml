pair = "obs-routing"
snapshot = "ac26f6a^"
source_commit = "ac26f6a"
source_document = "CHANGELOG.md, 2026-09-25 entry on routing national multi-cluster fits"
expected_catchers = ["implementation-critic"]

defect = """
The router decides between the joint national fit and the per-cluster solver
by counting distinct observation values per period with nunique. Each
cluster's observation is a capacity-weighted mean of its grid points' values
of one national number, so the means differ in their last bits (about 1e-16)
and count as distinct. Every national fit with more than one cluster is then
routed to the per-cluster solver, which fits each cluster's offset alone
against the national series, instead of the joint fit. Exact equality of
floating-point means is the wrong test; a tolerance on the spread is needed.
"""

judge_positive = """
**Verdict:** REVISE. **Blockers:** `country_obs_is_per_cluster` counts distinct
floats. The cluster observations are capacity-weighted averages of the same
national value, so rounding will make them differ at machine precision and
nunique will see several values. National multi-cluster fits would silently
go to the per-cluster path, not the joint fit the gate is written for. Compare
max minus min against a tolerance.
"""

judge_negative = """
**Verdict:** REVISE. **Blockers:** a gate at 1e-3 in capacity factor is not
calibrated against anything; derive it from the training periods' spread
before fixing it. The proposal should name the test year for each row.
"""

[defect_arm]
proposal = """
**Claim:** A residual gate on the joint national offset fit will refuse the
periods it fails to close, and so remove the country-level rows' worst
training periods without touching the rest.

**Mechanism:** For a national observation, the joint fit chooses every
cluster's offset together so the capacity-weighted national simulation
matches the observed national capacity factor. A period it cannot close leaves
a residual, and a fitted offset from such a period is not trustworthy.

**Change:** In `src/vwf/correction.py`, after `find_offsets_country_level`
returns, refuse the period (all offsets NaN) when the remaining absolute error
exceeds 1e-3 in capacity factor. Routing is unchanged: `country_obs_is_per_cluster`
in `src/vwf/data.py` sends a fit to the per-cluster solver when the
observation takes more than one distinct value within a period, counted with
`nunique` over (year, time slice), and to the joint fit otherwise. In a
country-level frame each cluster's `obs` is the capacity-weighted mean of its
grid points' values of the national series. The gate therefore applies to
every national fit, at every cluster count; zonal observations (SE, NO bidding
zones) keep the per-cluster solver and are not gated.

**Test:** The national country rows (FR, BE, IE, ES, IT, PT) at k=1 and at
their scorecard k, scorecard configs, training 2015 to 2020 (IE 2017 to 2020),
test year 2021. Fleet, curve library and ERA5 files fixed. Compared against
the uncorrected run and the current affine correction.

**Gates:** Pass if the gate refuses under 10% of periods per row and test-year
RMSE does not rise in any row by more than 0.002. Fail otherwise.

**Expected effect and size:** A few percent of periods refused, concentrated
in IT and PT; test-year RMSE changes under 0.001.

**Risks:** Refused periods shorten the accepted years, which may drop a
cluster's factor altogether.
"""

