source_document = "docs/findings/scorecard.md, the note on the joint fit's stopping tolerance"
expected_catchers = ["method-critic", "implementation-critic"]

defect = """
The joint national offset fit minimises a squared capacity-factor error of
about 1e-4 with L-BFGS-B at ftol 1e-6. L-BFGS-B divides the change in the
objective by max(|f|, 1), so with f far below 1 the ftol acts as an absolute
threshold: a fit whose first step lowers the error by less than 1e-6 stops
there and reports success with the offsets still at or near their zero start.
Offsets near zero, and success=True, are then artefacts of the stopping rule,
not evidence that no offset is needed.
"""

judge_positive = """
**Verdict:** REVISE. **Blockers:** the stopping tolerance is wrong for this
objective. The squared error starts near 1e-4, and SciPy's L-BFGS-B tests the
relative reduction against max(|f|, 1), so ftol=1e-6 is effectively absolute
here; the optimiser can stop after one step with success=True and offsets
still at zero. Offsets near zero would then say nothing about the physics.
"""

judge_negative = """
**Verdict:** REVISE. **Blockers:** the test year is not stated for Ireland,
and the comparison should be against the uncorrected run as well as the
