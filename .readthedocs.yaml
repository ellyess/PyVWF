# Read the Docs build configuration.
# The Sphinx setup lives in docs/conf.py; the docs dependencies come from the
# `docs` extra in pyproject.toml, so this file, CI, and a local build all
# install the same thing.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Match CI's `sphinx-build -W`: a broken docstring or a guide that falls out
  # of the toctree fails the build instead of quietly degrading the site.
  fail_on_warning: true

python:
  install:
    # autodoc imports vwf, so install the package itself (with its runtime
    # dependencies) plus the docs extra.
    - method: pip
      path: .
      extra_requirements:
        - docs
