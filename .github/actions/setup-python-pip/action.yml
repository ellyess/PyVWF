name: Set up Python and pip
description: >
  setup-python with pip caching, then the latest pip. Every job that installs
  the package starts with this; the install itself stays in the job, because
  each job installs different extras with a different constraints file.
inputs:
  python-version:
    description: Python version for setup-python.
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip
