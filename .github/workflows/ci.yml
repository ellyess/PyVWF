name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # mypy runs on a single Python rather than the test matrix: numpy's
          # bundled stubs use PEP 695 syntax that mypy only parses when
          # targeting 3.12+.
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tooling
        # Pinned by constraints/py312.txt, so ruff, mypy and pandas-stubs are
        # the versions the repository was checked with (scripts/dev/lock.py).
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints/py312.txt

      - name: Lint (ruff)
        # The whole code tree, scripts and examples included, and the formatting
        # the pre-commit hook enforces.
        run: |
          ruff check src tests scripts examples
          ruff format --check src tests scripts examples

      - name: Type check (mypy)
        run: mypy

      - name: Import layers (import-linter)
        # The layering of src/pyvwf, in .importlinter: a module imports only from
        # the layers below it.
        run: lint-imports

      - name: Declared dependencies (deptry)
        # Every import in src/ is declared, and every declared dependency is
        # used or listed with its reason in pyproject.toml.
        run: deptry src

      - name: Dead code (vulture)
        # src/ at confidence 80; the kept exceptions are named in pyproject.toml.
        run: vulture

      - name: Commit hooks (pre-commit)
        # The hooks a contributor's commit runs, over every tracked file: the
        # em-dash check, the whitespace and end-of-file fixers, and the TOML and
        # YAML checks are not covered by the steps above, and a commit made
        # without the hooks installed would otherwise pass here.
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # 3.10 to 3.12 install through constraints/py3XX.txt (scripts/dev/lock.py),
        # so their result depends on the repository, not on that day's PyPI.
        # 3.10 resolves pandas 2 and 3.11 and 3.12 pandas 3, which keeps the
        # split that has caught breakages. 3.13 stays unpinned: the cell that
        # sees a new release before the files are refreshed.
        include:
          - python-version: "3.10"
            constraints: constraints/py310.txt
          - python-version: "3.11"
            constraints: constraints/py311.txt
          - python-version: "3.12"
            constraints: constraints/py312.txt

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        # Install from pyproject rather than a hand-curated pip list, so CI
        # actually exercises the dependency metadata a `pip install pyvwf` user
        # gets. A curated list silently papers over missing declared deps:
        # that is how the missing `bottleneck` dependency reached main.
        # The `data` extra is deliberately NOT installed: the test suite and the
        # example must pass without the data-acquisition libraries.
        run: |
          python -m pip install --upgrade pip
          if [ -n "${{ matrix.constraints }}" ]; then
            pip install -e ".[dev]" -c "${{ matrix.constraints }}"
          else
            pip install -e ".[dev]"
          fi
          python -c "import pandas, numpy; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      - name: Run tests
        # The fast set on pushes and pull requests; every test on a manual
        # dispatch. The realdata tests skip here either way, since the data they
        # read is git-ignored; the markers are in pyproject.toml.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pytest tests -q --cov=pyvwf --cov-report=term-missing
          else
            pytest tests -q --cov=pyvwf --cov-report=term-missing -m "not slow and not realdata"
          fi

      - name: Run minimal example (end-to-end on bundled synthetic data)
        run: python examples/run_minimal.py

  extras:
    name: Test with every extra (Python 3.12)
    runs-on: ubuntu-latest
    # The test job installs [dev] only, so the physics-informed tests (torch),
    # the gridded-export tests (pykrige, rasterio) and anything the
    # acquisition libraries reach skip there. This job installs them and runs
    # the same fast set, and fails if any test still skips for a missing import.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package with every extra
        # torch from the CPU index: the default wheel carries CUDA and is
        # several gigabytes, none of which the tests use.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,pinn,grid,data]"

      - name: Run tests
        # No -q: the ini already sets it, and a second one hides the summary line.
        # shell: bash adds pipefail; the default shell does not set it, so a
        # failing pytest piped into tee passed this step until it was added.
        shell: bash
        run: pytest tests -rs -m "not slow and not realdata" | tee /tmp/extras.log

      - name: No test skipped for a missing import
        run: |
          if grep -E "SKIPPED.*(could not import|No module named)" /tmp/extras.log; then
            echo "a test skipped for a missing import although every extra is installed"
            exit 1
          fi

  examples:
    name: Examples (every file)
    runs-on: ubuntu-latest
    # examples/ holds only what CI executes on bundled data. This job runs every
    # Python file in it, so an example that needs local data fails here.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run every example
        # Sorted, so data/generate_example_data.py regenerates the bundled data
        # before run_minimal.py reads it.
        env:
          MPLBACKEND: Agg
        run: |
          for f in $(git ls-files 'examples/*.py' | sort); do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

      - name: The regenerated example data matches the committed data
        # To a relative 1e-12, not byte for byte: the synthetic observations go
        # through transcendental functions whose last bit differs between the
        # macOS and Linux maths libraries, so a regeneration on one platform
        # differs from the other's in the sixteenth significant digit. The
        # NetCDF is compared by its values, since its bytes carry library
        # metadata.
        run: |
          mkdir -p /tmp/committed
          for f in $(git ls-files 'examples/data/*.csv' 'examples/data/*.nc'); do
            git show "HEAD:$f" > "/tmp/committed/$(basename "$f")"
          done
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import xarray as xr
          for new in sorted(Path("examples/data").rglob("*.csv")):
              pd.testing.assert_frame_equal(
                  pd.read_csv(new), pd.read_csv(Path("/tmp/committed") / new.name),
                  check_exact=False, rtol=1e-12, atol=0)
          for new in sorted(Path("examples/data").rglob("*.nc")):
              xr.testing.assert_allclose(
                  xr.open_dataset(new), xr.open_dataset(Path("/tmp/committed") / new.name),
                  rtol=1e-12, atol=0)
          print("example data matches")
          PY

      - name: No example writes over any other tracked file
        run: git diff --exit-code -- . ':!examples/data/*.csv' ':!examples/data/*/*.nc'

  docs:
    name: Docs (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and docs tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build the API reference and guides
        # -W turns warnings into errors: a docstring that stops parsing, or a
        # guide that falls out of the toctree, fails the build rather than
        # quietly degrading the site.
        run: sphinx-build -b html docs docs/_build/html -W

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html

  docker:
    name: Docker (build + run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        # Plain docker build rather than buildx with a registry cache: this job
        # exists to prove the image builds from a clean checkout, and a warm
        # cache would hide a broken dependency layer.
        run: docker build -t pyvwf:ci .

      - name: The default command runs end to end on bundled data
        # Same synthetic example the test job runs on the host, so a failure
        # here is specifically a packaging or environment problem rather than a
        # regression in the correction.
        run: docker run --rm pyvwf:ci | tee /tmp/demo.log

      - name: The example actually corrected something
        # Guards against an image that starts, prints nothing useful and exits
        # zero, which a smoke test on exit status alone would pass.
        run: grep -q "reduced the mean capacity-factor error" /tmp/demo.log

      - name: The console script is on PATH
        run: docker run --rm pyvwf:ci pyvwf-validate --help

      - name: The bundled curve library resolves inside the image
        # PYVWF_INPUT points at an empty mount point by default, so this also
        # checks the fallback to the packaged open library works when no input
        # tree is mounted.
        run: |
          docker run --rm pyvwf:ci python -c "
          from pyvwf.config import PyVWFPaths
          import pandas as pd
          df = pd.read_csv(PyVWFPaths.reference_file('power_curves.csv'))
          print('curves:', df.shape[1] - 1)
          assert df.shape[1] > 1
          "

      - name: It does not run as root
        run: |
          test "$(docker run --rm pyvwf:ci id -un)" = pyvwf
          test "$(docker run --rm pyvwf:ci id -u)" = 1000

      - name: Report the image size
        run: docker image ls pyvwf:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  package:
    name: Package (build + clean install)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Install the wheel into a clean environment
        # No repo on sys.path: proves the *installed artefact* is self-contained
        # and that the declared dependencies are sufficient to import and run it.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import pyvwf; print('pyvwf', pyvwf.__version__)"
          /tmp/clean/bin/python -c "import pyvwf.wind, pyvwf.correction, pyvwf.metrics, pyvwf.viz"
          /tmp/clean/bin/python -c "import pyvwf.harness, pyvwf.sources, pyvwf.provenance, pyvwf.curves"
          /tmp/clean/bin/pyvwf-validate --help
