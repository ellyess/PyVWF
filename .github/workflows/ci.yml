name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Core scientific stack needed by the unit tests (kept light: the
          # tests use synthetic data and do not require geospatial/atlite/ML).
          pip install numpy pandas scipy xarray "dask[dataframe]" scikit-learn
          pip install pytest pytest-cov ruff
          # Install PyVWF itself so `import vwf` resolves under the `pytest`
          # console script (which does not add the repo root to sys.path).
          # --no-deps keeps the run lightweight and verifies the package imports
          # without the optional geospatial/atlite/ML extras.
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check vwf tests

      - name: Run tests
        run: pytest tests -q --cov=vwf --cov-report=term-missing
