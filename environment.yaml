# A conda environment for running PyVWF: the conda-forge scientific stack, the
# `data` extra (entsoe-py, openpyxl, pyarrow) and an editable install.
#
# It takes the lower bounds pyproject.toml declares and pins nothing else, so
# it builds on any Python PyVWF supports, 3.13 included. It is not the
# environment CI tests: CI installs `pip install -e ".[dev]"` with the
# constraints file for its Python version (constraints/py310.txt and so on),
# without the `data` extra; CONTRIBUTING.md describes that route. A harness
# run's manifest records the versions it actually ran with.
name: pyvwf
channels:
  - conda-forge
dependencies:
  # Python version
  - python>=3.10

  # Core scientific stack
  - numpy>=1.24.0
  - pandas>=2.2.0
  - xarray>=2023.0.0
  - dask>=2023.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - threadpoolctl>=3.1.0

  # Geospatial
  - geopandas>=0.13.0
  - shapely>=2.0.0
  - pyproj>=3.6.0

  # Visualization
  - matplotlib>=3.7.0

  # Data formats
  - netcdf4>=1.6.0
  - openpyxl>=3.1.0
  - pyarrow>=12.0.0

  # Performance
  - bottleneck>=1.3.0

  # Development tools (optional). ruff is pinned to the version CI and the
  # pre-commit hook use (tests/test_tool_pins.py checks all three agree).
  - pytest>=7.0.0
  - ruff==0.16.8

  # Install additional packages via pip
  - pip
  - pip:
      # Energy data APIs (not available on conda-forge)
      - entsoe-py>=0.6.0

      # Install local package in editable mode
      - -e .
