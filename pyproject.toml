[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvwf"
version = "0.1.0"
description = "Python Virtual Wind Farm (PyVWF) - Wind speed bias correction and capacity factor estimation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Ellyess Benmoufok", email = "benmoufok.ellyess@gmail.com"}
]
keywords = ["wind energy", "virtual wind farm", "bias correction", "capacity factor", "renewable energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core scientific stack
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "xarray>=2023.0.0",
    "dask[dataframe]>=2023.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",

    # Geospatial
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "utm>=0.7.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",

    # Data formats
    "netCDF4>=1.6.0",
    "openpyxl>=3.1.0",
    "pyarrow>=12.0.0",

    # Performance
    "bottleneck>=1.3.0",

    # Energy data APIs
    "entsoe-py>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]

[project.scripts]
pyvwf-train = "vwf.cli.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vwf = ["*.csv", "*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes. Kept intentionally lean so the legacy
# research scripts pass while still catching dead code, unused imports, and
# real bugs (e.g. the discarded-merge bug fixed in vwf/vwf.py).
select = ["E", "F"]
ignore = [
    "E501",  # line length handled case-by-case in research code
    "E741",  # ambiguous names (l, I) are common in maths-heavy code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path manipulation before imports in a few tests
