[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvwf"
description = "Python Virtual Wind Farm (PyVWF) - Wind speed bias correction and capacity factor estimation"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Ellyess Benmoufok", email = "benmoufok.ellyess@gmail.com"}
]
keywords = ["wind energy", "virtual wind farm", "bias correction", "capacity factor", "renewable energy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Single source of truth: vwf/_version.py, re-exported as vwf.__version__
# (see tool.setuptools.dynamic below).
# tests/test_packaging.py asserts it stays in step with CITATION.cff.
dynamic = ["version"]

# Everything needed to simulate, bias-correct, evaluate and plot. Data
# acquisition (ENTSO-E, raw Excel fleet registries) is deliberately NOT here:
# it needs credentials and extra libraries most users never touch. See the
# `data` extra.
dependencies = [
    # Core scientific stack
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "xarray>=2023.0.0",
    "dask[dataframe]>=2023.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    # KMeans runs on one thread for a partition that does not depend on the
    # machine (vwf.clustering); scikit-learn installs it, the import is direct.
    "threadpoolctl>=3.1.0",

    # Geospatial
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",

    # Visualization
    "matplotlib>=3.7.0",

    # Data formats
    "netCDF4>=1.6.0",

    # Performance. bottleneck also backs xarray's .bfill(), which prep_era5
    # uses to fill the surface-roughness field, so it is a hard requirement.
    "bottleneck>=1.3.0",
    # vwf.harness.regions reads region configs with tomllib, in the standard
    # library from 3.11; 3.10 needs the backport at runtime, not only in tests.
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Data acquisition only: vwf.datasets.fetch_entsoe_capacity_factors (entsoe-py,
# pyarrow for parquet output) and vwf.datasets.process_dk_raw_data (openpyxl for
# the .xlsx fleet registry). Nothing in the simulation path imports these.
data = [
    "entsoe-py>=0.6.0",
    "openpyxl>=3.1.0",
    "pyarrow>=12.0.0",
    # ERA5 acquisition (scripts/fetch/era5.py --region au_nem); user-executed downloads.
    "cdsapi>=0.7.0",
]

# The physics-informed correction (vwf.pinn) only. Kept out of the base install
# so that running the affine pipeline does not pull a deep-learning stack, and
# out of CI so the matrix stays light; tests/test_pinn_physics.py skips itself
# when torch is absent.
pinn = [
    "torch>=2.0",
]

# The gridded-correction extension (vwf.extensions.grid) only: kriging needs
# pykrige, and the terrain feature extraction reads GeoTIFFs through rasterio.
# Kept out of the base install so the affine pipeline does not pull them, and
# out of CI so the matrix stays light; the tests skip themselves when absent.
grid = [
    "pykrige>=1.7.0",
    "rasterio>=1.3.0",
]

# The TouchDesigner export (scripts/analysis/export_voronoi_frames.py) only:
# earcut triangulates the clipped Voronoi cells, because TouchDesigner's own
# Python has numpy but no scipy or shapely, so every polygon has to arrive as
# flat triangles. Nothing in the package imports it.
touchdesigner = [
    "mapbox-earcut>=2.0.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    # Pinned to the ruff-pre-commit rev in .pre-commit-config.yaml: 0.12 and
    # 0.16 format differently, so an unpinned CI ruff can fail
    # `ruff format --check` with no code change (tests/test_tool_pins.py).
    "ruff==0.16.8",
    "mypy>=1.0.0",
    "pandas-stubs",
    "pre-commit>=3.0.0",
    "import-linter>=2.0",
    "deptry>=0.20",
    "vulture>=2.10",
    # tests/test_packaging.py parses pyproject.toml. tomllib entered the stdlib
    # in 3.11, so 3.10 needs the backport.
    "tomli>=2.0.0; python_version < '3.11'",
]

docs = [
    "sphinx>=6.0.0",
    "furo>=2024.1.29",  # the site theme; .readthedocs.yaml installs this extra
    "myst-parser>=2.0.0",  # the narrative guides in docs/ are Markdown
]

[project.urls]
Homepage = "https://github.com/ellyess/PyVWF"
Repository = "https://github.com/ellyess/PyVWF"

[project.scripts]
pyvwf-validate = "vwf.cli.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "vwf._version.__version__"}

[tool.setuptools.package-data]
# The previous glob ("*.csv") matched nothing: there are no data files directly
# under src/vwf/. The synthetic reference tables live in vwf/resources/ and are
# bundled so an installed PyVWF runs outside a repository checkout. The region
# shapes (13 MB) are deliberately not shipped.
vwf = ["py.typed"]
"vwf.resources" = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# CI runs `-m "not slow and not realdata"` on pushes and pull requests, and the
# full set on a manual dispatch. CONTRIBUTING.md gives both commands.
markers = [
    "realdata: reads git-ignored data under input/ or output/, and skips where it is absent",
    "slow: a pin that takes seconds per case; left out of the default CI run",
]
# `python -m pytest` puts the working directory on sys.path but a bare `pytest`
# does not, and CI invokes the bare form. tests/test_country_zonal.py imports a
# helper from tests/test_pipeline.py, so the repo root has to be importable
# either way.
pythonpath = ["."]
# Both filters silence UPSTREAM noise, not PyVWF code, so real warnings from
# this package stay visible. Drop each when the upstream fix ships.
filterwarnings = [
    # netCDF4's compiled module was built against an older numpy C-API than
    # the numpy pip resolves; the struct-size notice is benign by design and
    # currently unavoidable on a fresh install (fires on every CI Python).
    "ignore:numpy.ndarray size changed:RuntimeWarning",
    # xarray's netCDF4 backend assigns .shape, deprecated by numpy 2.5; only
    # environments resolving numpy >= 2.5 see it (CI's 3.12 job).
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["vwf"]
omit = [
    # Data-acquisition CLIs: they talk to the ENTSO-E API (needs a key) or parse
    # raw registry spreadsheets that are not redistributable, so they cannot run
    # in CI. Measuring them would only dilute the number the gate below defends.
    # They are excluded from mypy and the API reference for the same reason.
    "*/vwf/datasets/fetch_entsoe_capacity_factors.py",
    "*/vwf/datasets/generate_country_level_training_data.py",
    "*/vwf/datasets/process_dk_raw_data.py",
    "*/vwf/datasets/combine_era5_files.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# A ratchet, not a target: set just below where the suite currently sits, so
# coverage cannot silently regress. Raise it as the remaining gaps are closed.
fail_under = 63
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes. Kept intentionally lean so the legacy
# research scripts pass while still catching dead code, unused imports, and
# real bugs (e.g. a discarded-merge bug once fixed in the legacy vwf/vwf.py).
select = ["E", "F"]
ignore = [
    "E501",  # line length handled case-by-case in research code
    "E741",  # ambiguous names (l, I) are common in maths-heavy code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path manipulation before imports in a few tests

[tool.deptry]
# Checks src/ against the declared dependencies; CI runs `deptry src`.
known_first_party = ["vwf"]
pep621_dev_dependency_groups = ["dev", "docs"]

[tool.deptry.package_module_name_map]
entsoe-py = "entsoe"
mapbox-earcut = "mapbox_earcut"

[tool.deptry.per_rule_ignores]
# Declared but never imported by src/, for a stated reason each:
# - netCDF4, bottleneck: xarray's backends, loaded by name, never imported;
# - openpyxl, pyarrow: pandas' Excel and Parquet engines, likewise;
# - cdsapi, mapbox-earcut: used only by scripts/ (fetch/era5.py,
#   analysis/export_voronoi_frames.py), which deptry does not scan.
DEP002 = ["netCDF4", "bottleneck", "openpyxl", "pyarrow", "cdsapi", "mapbox-earcut"]

[tool.vulture]
# Dead-code scan of src/ at a conservative confidence; CI runs `vulture`.
paths = ["src"]
min_confidence = 80
# A parameter an interface requires: matplotlib's FuncFormatter calls
# _comma_formatter(x, pos).
ignore_names = ["pos"]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use PEP 695 syntax that mypy
# only parses when targeting 3.12+, so mypy runs under the CI lint job's
# interpreter (3.12) rather than each matrix Python.
files = ["src/vwf"]
# The scientific stack ships few usable stubs (xarray, geopandas, sklearn,
# netCDF4); without this every import is an error and the signal is lost.
ignore_missing_imports = true
# Bodies of unannotated functions are not type-checked. This makes mypy a
# ratchet rather than a wall: annotating a function opts its body in, so
# coverage grows module by module instead of demanding a big-bang rewrite of
# the research code.
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Data-acquisition scripts: procedural, CLI-shaped, and exercised against live
# APIs rather than the test suite. Not worth typing yet; revisit if they grow
# into a supported surface.
module = "vwf.datasets.*"
ignore_errors = true
