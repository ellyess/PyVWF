# NL for the physics-informed leave-one-country-out study only
# (docs/findings/method-physics-informed-loco-prereg.md). NL has no scorecard
# config: its observations are capped at 0.57, so it has no row. This copy of
# configs/regions/nl.toml differs in three [era5] lines, the archive the other
# European countries use and the per-timestep roughness, so the NL fold reads
# the same winds as every other fold. NL is scored, never trained on.
# Region config for the multi-region validation harness (docs/design/harness.md).
# Seasons are EXPLICIT month lists; never rely on the legacy NH mapping.

[region]
code = "NL"
name = "Netherlands"

[observations]
source = "entsoe-country"
obs_level = "country"
obs_unit = "country"
train_years = [2015, 2021]
test_years = [2023]

[era5]
roughness = "derived"
path = "era5/EU_2026-09"
bbox = [2.5, 7.5, 50.5, 53.8]
file_tag = "EU_2026-09"

[correction]
model = "affine-wind"
cluster_list = [1, 5]  # 1 = identifiable national baseline; 5 = the grid points own clusters
time_slices = ["fixed", "season"]

[seasons]
summer = [6, 7, 8]
autumn = [9, 10, 11]
winter = [12, 1, 2]
spring = [3, 4, 5]
