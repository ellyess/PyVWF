# Region config for the multi-region validation harness (docs/HARNESS_DESIGN.md).
# Seasons are EXPLICIT month lists; never rely on the legacy NH mapping.

[region]
code = "NO"
name = "Norway"

[observations]
source = "entsoe-country"
obs_level = "country"
obs_unit = "country"
train_years = [2015, 2021]
test_years = [2023]

[era5]
path = "era5/EU"
bbox = [4.0, 31.5, 57.5, 71.5]
file_tag = "EU"

[correction]
model = "affine-wind"
cluster_list = [5]
time_slices = ["fixed", "season"]

[seasons]
summer = [6, 7, 8]
autumn = [9, 10, 11]
winter = [12, 1, 2]
spring = [3, 4, 5]
