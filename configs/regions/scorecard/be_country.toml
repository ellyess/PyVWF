# Region config for the multi-region validation harness (docs/design/HARNESS_DESIGN.md).
# Seasons are EXPLICIT month lists; never rely on the legacy NH mapping.

[region]
code = "BE"
name = "Belgium"

[observations]
source = "entsoe-country"
obs_level = "country"
obs_unit = "country"
train_years = [2015, 2021]
test_years = [2023]

[era5]
path = "era5/EU"
bbox = [2.2, 6.6, 49.3, 51.8]
file_tag = "EU"

[correction]
model = "affine-wind"
cluster_list = [1, 3]  # 1 = identifiable national baseline; 3 = the grid points own clusters
time_slices = ["fixed", "season"]

[seasons]
summer = [6, 7, 8]
autumn = [9, 10, 11]
winter = [12, 1, 2]
spring = [3, 4, 5]
