# Checks run on every commit. Install once with `pre-commit install`; run over
# the whole tree with `pre-commit run --all-files`. CONTRIBUTING.md has both.
#
# Data files are excluded from the whitespace fixers: the committed open
# curve library and the pin fixtures under tests/data/ are identified by
# sha256, so a stripped trailing space would change what they pin.
exclude: ^(input/|tests/data/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # Code only. ruff also formats Python blocks inside Markdown, and the
      # findings documents are dated records whose content is not edited.
      - id: ruff-check
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude_types: [csv, geojson, json, png, svg]
      - id: trailing-whitespace
        exclude_types: [csv, geojson, json, png, svg]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
